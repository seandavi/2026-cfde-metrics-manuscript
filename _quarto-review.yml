# Review-format build (issue #51): continuous line numbers, double
# spacing and page numbers, for the revision resubmission and for
# citing page/line in the response to reviewers. Merged over
# _quarto.yml when rendering with
#   quarto render --profile review
# Outputs land in _review/ so the default _site/ build is untouched.
project:
  output-dir: _review

format:
  pdf:
    # The guide asks for 12 pt; the article class default is 10 pt.
    fontsize: 12pt
    include-in-header: assets/review-header.tex
  docx:
    # Generated by assets/make-review-reference-docx.py from
    # assets/trends-reference.docx.
    reference-doc: assets/trends-review-reference.docx
