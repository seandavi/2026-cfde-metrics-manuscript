project:
  type: website
  output-dir: _site
  # Render targets: the main manuscript plus the three separate-file
  # submission deliverables (Significance, Outstanding Questions, Key
  # References). Each renders to its own page in the website and to
  # standalone .docx/.pdf for Editorial Manager upload.
  render:
    - index.qmd
    - significance.qmd
    - outstanding-questions.qmd
    - key-references.qmd
  # Resolves @doi:, @pmid:, @arxiv:, @isbn:, @url:, @wikidata:, @pmcid:,
  # and bare DOIs before pandoc runs. The resolved CSL JSON lands in
  # references.json (gitignored — regenerated each render) and pandoc
  # citeproc reads it alongside hand-curated entries in references.bib.
  pre-render: quartobot resolve --from-scan . --output references.json --id-mode citation-key

website:
  title: "Lifecycle-aware evaluation of biomedical data ecosystems"
  description: "Trends Open Opinion article: a lifecycle-aware framework for evaluating federated biomedical data ecosystems, grounded in the NIH Common Fund Data Ecosystem."
  navbar:
    background: primary
    search: false
    left:
      - text: "Manuscript"
        href: index.html
      - text: "Significance"
        href: significance.html
      - text: "Outstanding questions"
        href: outstanding-questions.html
      - text: "Key references"
        href: key-references.html
    right:
      - icon: github
        href: https://github.com/seandavi/2026-cfde-metrics-manuscript
        aria-label: GitHub source
  page-footer:
    left: "Submitted to *Trends Open* under the CC BY 4.0 license."
    right: |
      Built with [Quarto](https://quarto.org) and [quartobot](https://github.com/quartobot/quartobot).

bibliography:
  - references.bib
  - references.json
csl: assets/trends-journals.csl

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: false
    theme: cosmo
    # PDF / DOCX format-switcher buttons stay hidden. CI's per-format
    # render loop (--to html, then --to pdf, then --to docx) overwrites
    # _site/ on each pass, so only the last format's outputs survive
    # to deploy. Until the upstream workflow runs a single `quarto
    # render` for website projects (filed: quartobot/quartobot#103),
    # the buttons would point at files CI doesn't ship. Authors render
    # all three formats locally for Editorial Manager submission.
    format-links: false
  pdf:
    documentclass: article
    papersize: letter
    geometry:
      - margin=1in
    toc: false
    number-sections: false
    colorlinks: true
    fig-pos: "H"
    keep-tex: true
  docx:
    toc: false
    number-sections: false
    reference-doc: assets/trends-reference.docx
    filters:
      - assets/strip-figures-docx.lua

execute:
  echo: false
  warning: false
