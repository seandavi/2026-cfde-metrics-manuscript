# Renders on every push and PR via the upstream reusable workflow.
# Override inputs in the `with:` block below; see
#   https://github.com/quartobot/quartobot/blob/main/.github/workflows/render-reusable.yml
# for the full list.

name: Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    uses: quartobot/quartobot/.github/workflows/render-reusable.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      # Quartobot's reusable workflow doesn't natively support
      # project-type: website yet. Workaround: project-type=book +
      # book-output-dir=_site stages the website's output dir tree
      # correctly. Formats default to html,pdf,docx so the format-
      # switcher buttons in the rendered pages resolve.
      # Filed upstream as quartobot/quartobot#103.
      project-type: book
      book-output-dir: _site
      quarto-version: release
