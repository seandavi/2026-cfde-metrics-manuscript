# Renders on every push and PR via the upstream reusable workflow.
# Override inputs in the `with:` block below; see
#   https://github.com/quartobot/quartobot/blob/main/.github/workflows/render-reusable.yml
# for the full list.

name: Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    uses: quartobot/quartobot/.github/workflows/render-reusable.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      # Quartobot's reusable workflow doesn't natively support
      # project-type: website yet. Using `book` with a custom
      # book-output-dir pointed at `_site/` stages the website's
      # rendered directory tree into public/v/<sha>/ correctly.
      # Filed upstream as quartobot/quartobot#... (TBD).
      project-type: book
      book-output-dir: _site
      quarto-version: release
