# Renders on every push and PR via the upstream reusable workflow.
# Override inputs in the `with:` block below; see
#   https://github.com/quartobot/quartobot/blob/main/.github/workflows/render-reusable.yml
# for the full list.

name: Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    uses: quartobot/quartobot/.github/workflows/render-reusable.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      # Quartobot's reusable workflow doesn't natively support
      # project-type: website yet. Two settings make it work:
      # 1. project-type=book + book-output-dir=_site stages the
      #    website's output dir tree.
      # 2. formats: html — the workflow's per-format render loop
      #    overwrites _site/ on each pass, so we render html only.
      #    PDF/DOCX produced locally by authors for Editorial Manager.
      # Filed upstream as quartobot/quartobot#103.
      project-type: book
      book-output-dir: _site
      formats: html
      quarto-version: release
